<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script type="importmap">
			%IMPORTMAP%
		</script>
		<script id="sandbox-data" type="application/json">
			%SANDBOX_DATA%
		</script>
		<style>
			@layer default {
				*,
				*::before,
				*::after {
					box-sizing: border-box;
				}

				body {
					height: 100svh;
					margin: 0;
					font-family: 'Atkinson Hyperlegible', sans-serif;
					color: #fff;
					line-height: 1.5;
					-webkit-font-smoothing: antialiased;
				}

				img,
				picture,
				video,
				canvas,
				svg {
					max-width: 100%;
					display: block;
				}

				input,
				button,
				textarea,
				select {
					font: inherit;
				}
			}
		</style>
	</head>
	<body>
		<div id="app"></div>
		<script type="module">
			//%SCRIPT%
		</script>
	</body>
</html>
